{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <main>
    <h1>Image Gallery</h1>
    <p>Upload an image — it is saved with <code>ImageField</code> and shown with <code>photo.image.url</code>.</p>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Upload</button>
    </form>

    <hr>

    {% if photos %}
      <div class="gallery">
        {% for photo in photos %}
          <figure>
            <img src="{{ photo.image.url }}" alt="{{ photo.title }}">
            <figcaption>
              {{ photo.title }}
              <form method="post" action="{% url 'delete' photo.pk %}">
                {% csrf_token %}
                <button type="submit">Delete</button>
              </form>
            </figcaption>
          </figure>
        {% endfor %}
      </div>
    {% else %}
      <p>No photos yet. Upload one above.</p>
    {% endif %}
  </main>
</body>
</html>
